<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/style.css" />
    <title>Document</title>
  </head>
  <body>
    <!-- Форма регистрации -->
    <label>Имя</label><input class="name" type="text" /> <br />
    <label>Телефон</label><input class="phone" type="text" /> <br />
    <label>Email</label><input class="email" type="email" /> <br />
    <label>Пароль</label><input class="password" type="password" /> <br />
    <button class="signup">Зарегистрироваться</button> <br />
    <!-- Форма авторизации -->
    <label>Email</label><input class="emailLogin" type="email" /> <br />
    <label>Пароль</label><input class="passwordLogin" type="password" /> <br />
    <button class="login">Войти</button><br />
    <!-- Общее поле -->
    <p class="statusMessage"></p>
  </body>
  <script src="scripts/script.js"></script>
</html>
